<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | HBO Max</title>
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/signIn.css">
    
</head>
<body>
    <div class="bar">
        <a href="index.html">
            <img class="bar__logo-hbo" src="assets/images/hbo-logo.svg" alt="logo da HBO Max">
        </a>
        <nav class="bar__menu">
            <a class="bar__link bar__login" href="#">ENTRAR</a>
            <a class="bar__link bar__signin" href="signIn.html">ASSINE AGORA</a>
        </nav>
    </div>
    <section class="sign-in">
        <div class="sign-in__form">
            <p class="sign-in__text-1">Entrar</p>
            <p class="sign-in__text-2">Você tem uma conta da HBO Max?</p>
            <input type="email" name="email" placeholder="Endereço de e-mail">
            <input type="password" name="password" pattern=".{8,}" placeholder="Senha">
            <div class="sign-in__btns">
                <button type="submit">Entrar</button>
                <a href="">Esqueceu a senha?</a>
            </div>
        </div>
        
    </section>
    <footer class="footer">
        <ul class="footer__menu">
            <li class="footer__item"><a href="">Agora na HBO Max</li></a> 
            <li class="footer__item"><a href="">Em breve</li></a>
            <li class="footer__item"><a href="">Filmes em destaque</a></li>
            <li class="footer__item"><a href="">Séries</a></li>
            <li class="footer__item"><a href="">Ajuda</a></li>
        </ul>
        <p>©️ 2024 Wanner Media Direct. Latim American LLC Todos os direitos reservados. HBO Max é usado sob licença.</p>
        <div class="footer__social">
            <a href=""><img class="footer__icon" src="assets/images/fb_0.png" alt="Icone do Facebook"></a>
            <a href=""><img class="footer__icon" src="assets/images/twitter_0.png" alt="Icone do twitter"></a>
            <a href=""><img class="footer__icon" src="assets/images/instagram_0.png" alt="Icone do Instagram"></a>
            <a href=""><img class="footer__icon" src="assets/images/youtube_0.png" alt="Icone do YouTube"></a>
        </div>
    </footer>
</body>
</html>
